# Builds the website (website/) with MkDocs, and publishes it to GitHub
# Pages on every push to master. Pull requests only build it. The code in
# the pages is tested by `go test` (tests/docs_test.go), in ci.yml.
name: docs

on:
  push:
    branches: [master]
    paths: [website/**, .github/workflows/docs.yml]
  pull_request:
    paths: [website/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install MkDocs
        working-directory: website
        run: pip install -r requirements.txt

      - name: Build
        working-directory: website
        run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
